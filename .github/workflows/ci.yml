name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only pytest. Deliberately NOT requirements.txt: that pulls torch,
      # faiss, sentence-transformers and the HF datasets stack -- gigabytes, for
      # a suite that tests pure functions. src/metrics.py is stdlib-only so the
      # whole job runs in seconds with no GPU and no network beyond this install.
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: pytest tests/ -v
